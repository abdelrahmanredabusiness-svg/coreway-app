<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The Core employee services">
  <meta name="theme-color" content="#FFFFFF">

  <!-- Opens full screen, like an app, when added to the iPhone home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="The Core">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>The Core</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #FFFFFF; transition: opacity .3s; }
    #splash img { width: min(64vw, 300px); }
    #splash .bar { width: 120px; height: 3px; margin: 24px auto 0; border-radius: 3px; background: rgba(44,102,112,.15); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #2C6670; animation: slide 1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading The Core">
    <div><img src="assets/assets/logo.png" alt="The Core"><div class="bar"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
